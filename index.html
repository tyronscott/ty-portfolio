<style>
        :root {
            --md-sys-color-primary: #8D6E63;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #D7CCC8;
            --md-sys-color-on-primary-container: #3E2723;
            --md-sys-color-surface: #FFFBFA;
            --md-sys-color-on-surface: #201A18;
            --md-sys-color-on-surface-variant: #53433F;
            --md-sys-color-outline: #85736E;
            --md-sys-color-error: #B3261E;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-scrim: rgba(0, 0, 0, 0.32);
        }

        .btn {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 16px 32px;
            border-radius: 28px;
            font-size: 16px;
            cursor: pointer;
            transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        }

        dialog {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
			backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);

			  /* --- ANIMATION: Initial state for entrance --- */
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }

		 @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }


        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.32);
			transition: opacity 0.3s ease-out;
        }

		  dialog[open]::backdrop {
             animation: fadeIn 0.3s ease-out forwards;
        }
        
        dialog.closing::backdrop {
            animation: fadeOut 0.3s ease-in forwards;
        }
        
		@starting-style {
            dialog[open] {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        /* --- ANIMATION: Final state for entrance --- */
        dialog[open] {
            opacity: 1;
            transform: scale(1);
        }

		@keyframes fadeOutScaleDown {
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

		 .modal-header, .form-field, .modal-actions {
             /* --- ANIMATION: Staggered content entrance --- */
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

		 @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        dialog[open] .modal-header,
        dialog[open] .form-field,
        dialog[open] .modal-actions {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.4s ease-out forwards;
        }

		 dialog[open] .modal-header { animation-delay: 0.05s; }
        dialog[open] .form-field:nth-of-type(1) { animation-delay: 0.1s; }
        dialog[open] .form-field:nth-of-type(2) { animation-delay: 0.15s; }
        dialog[open] .form-field:nth-of-type(3) { animation-delay: 0.2s; }
        dialog[open] .modal-actions { animation-delay: 0.25s; }

        /* --- ANIMATION: Class to trigger exit animation --- */
        dialog.closing {
            animation: fadeOutScaleDown 0.3s ease-in forwards;
        }
		
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            color: var(--md-sys-color-on-surface);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--md-sys-color-on-surface-variant);
        }

        .form-field {
            margin-bottom: 24px;
            position: relative;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 16px;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
        }

        .form-field label {
            position: absolute;
            top: 18px;
            left: 16px;
            color: var(--md-sys-color-on-surface-variant);
            pointer-events: none;
            transition: all 0.2s ease;
        }
        
        .form-field input:focus + label,
        .form-field input:not(:placeholder-shown) + label,
        .form-field textarea:focus + label,
        .form-field textarea:not(:placeholder-shown) + label {
            top: -10px;
            left: 12px;
            font-size: 12px;
            color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-surface);
            padding: 0 4px;
        }
        
        .form-field input:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--md-sys-color-primary);
            border-color: var(--md-sys-color-primary);
        }

        .form-field textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .error-message {
            color: var(--md-sys-color-error);
            font-size: 12px;
            display: none;
            margin-top: 4px;
            margin-left: 16px;
        }

        .form-field.invalid input,
        .form-field.invalid textarea {
            border-color: var(--md-sys-color-error);
        }

        .form-field.invalid .error-message {
            display: block;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
        }

    </style>

	<script>
		// Use a timeout to ensure the Vue.js app has rendered its content
		setTimeout(() => {
			console.log("INJECTING")	
			// 1. Define the HTML for the dialog as a string
			const dialogHTML = `
				<dialog id="contactModal">
					<div class="modal-header">
						<h2>Contact Us</h2>
						<button class="close-btn" id="closeModalBtn">&times;</button>
					</div>
					<form id="contactForm" novalidate>
						<div class="form-field">
							<input type="text" id="name" name="name" required placeholder=" ">
							<label for="name">Name</label>
							<div class="error-message">Name is required.</div>
						</div>
						<div class="form-field">
							<input type="email" id="email" name="email" required placeholder=" ">
							<label for="email">Email</label>
							<div class="error-message">Please enter a valid email address.</div>
						</div>
						<div class="form-field">
							<textarea id="message" name="message" required placeholder=" "></textarea>
							<label for="message">Message</label>
							<div class="error-message">Message is required.</div>
						</div>
						<div class="modal-actions">
							<button type="submit" class="btn">Send Message</button>
						</div>
					</form>
				</dialog>
			`;

			// 2. Inject the HTML string into the body
			document.body.insertAdjacentHTML('beforeend', dialogHTML);


			// 3. Now that the dialog is in the DOM, get references to all elements and add event listeners
			const contactButton = document.querySelector('body > app-root > app-footer > footer > section > a:nth-child(1)');
			const closeModalBtn = document.getElementById('closeModalBtn');
			const contactModal = document.getElementById('contactModal');
			const contactForm = document.getElementById('contactForm');
			const nameField = document.getElementById('name');
			const emailField = document.getElementById('email');
			const messageField = document.getElementById('message');

			// Check if the contact button exists before adding the listener
			if (contactButton) {
				contactButton.addEventListener('click', (event) => {
					event.preventDefault(); // Prevent default anchor tag behavior
					contactModal.showModal();
				});
			}

			closeModalBtn.addEventListener('click', () => {
				contactModal.close();
			});

			contactModal.addEventListener('click', (event) => {
				if (event.target === contactModal) {
					contactModal.close();
				}
			});
			
			// --- Validation Logic ---
			function validateField(field, validationFn) {
				const formField = field.parentElement;
				if (validationFn(field.value)) {
					formField.classList.remove('invalid');
					return true;
				} else {
					formField.classList.add('invalid');
					return false;
				}
			}
			
			const isNotEmpty = value => value.trim() !== '';
			const isValidEmail = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

			contactForm.addEventListener('submit', (event) => {
				event.preventDefault();
				
				const isNameValid = validateField(nameField, isNotEmpty);
				const isEmailValid = validateField(emailField, isValidEmail);
				const isMessageValid = validateField(messageField, isNotEmpty);

				if (isNameValid && isEmailValid && isMessageValid) {
					alert('Message sent successfully!');
					contactModal.close();
					contactForm.reset();
				}
			});

		}, 3000); // Wait 1 second (1000ms)
	</script>
